<svg xmlns="http://www.w3.org/2000/svg" width="720" height="750" viewBox="0 0 720 750" role="img" aria-labelledby="title desc">
<title id="title">EvoHarness-RL 的两条更新路径</title><desc id="desc">Claude 成功示范用于 Qwen SFT；Qwen 使用固定经验库生成轨迹，奖励用于 GRPO 更新参数，执行证据由 Claude 整理更新经验库。更新后的参数和经验库支持下一批任务。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8292a7"/></marker></defs>
<rect width="720" height="750" rx="14" fill="#f5f8fc"/>
<g font-family="Arial, 'Microsoft YaHei', sans-serif" text-anchor="middle">
<text x="360" y="44" font-size="13" letter-spacing="3" fill="#637084">LEARN TO ACT · LEARN TO USE MEMORY</text>
<rect x="115" y="70" width="490" height="78" rx="12" fill="#fff" stroke="#d6e1ef"/><text x="360" y="103" font-size="25" font-weight="700" fill="#20314b">Claude · 成功任务示范</text><text x="360" y="130" font-size="18" fill="#637084">业务动作 + BPE 笔记动作</text>
<path d="M360 150V180" stroke="#8292a7" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="115" y="187" width="490" height="75" rx="12" fill="#224b8d"/><text x="360" y="219" font-size="25" font-weight="700" fill="#fff">Qwen3-8B · SFT 冷启动</text><text x="360" y="245" font-size="18" fill="#dce8fb">学习下一步回复，掌握操作接口</text>
<path d="M360 264V297" stroke="#8292a7" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="115" y="304" width="490" height="96" rx="12" fill="#fff" stroke="#a9bfdc"/><text x="360" y="341" font-size="25" font-weight="700" fill="#20314b">学生采样一批任务</text><text x="360" y="372" font-size="19" fill="#637084">同批使用固定经验库，notes 暂存</text>
<path d="M360 402V425H187V454" fill="none" stroke="#8292a7" stroke-width="2" marker-end="url(#arrow)"/><path d="M360 425H533V454" fill="none" stroke="#8292a7" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="463" width="294" height="144" rx="12" fill="#eaf0fa" stroke="#b3c7e5"/><text x="187" y="498" font-size="15" letter-spacing="2" fill="#224b8d">参数更新</text><text x="187" y="535" font-size="26" font-weight="700" fill="#224b8d">GRPO</text><text x="187" y="568" font-size="19" fill="#435c7d">任务结果 · 效率 · 探索</text><text x="187" y="592" font-size="17" fill="#637084">输出：新的学生参数</text>
<rect x="386" y="463" width="294" height="144" rx="12" fill="#eaf5f2" stroke="#b0d4ca"/><text x="533" y="498" font-size="15" letter-spacing="2" fill="#18736c">经验更新</text><text x="533" y="535" font-size="25" font-weight="700" fill="#18736c">Claude 整理</text><text x="533" y="568" font-size="19" fill="#41685f">执行证据 + notes + 旧经验</text><text x="533" y="592" font-size="17" fill="#637084">输出：经验库编辑</text>
<path d="M187 609V637H360M533 609V637H360V657" fill="none" stroke="#8292a7" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="160" y="665" width="400" height="54" rx="27" fill="#20314b"/><text x="360" y="700" font-size="23" fill="#fff">新策略 + 新经验 → 下一批任务</text>
</g></svg>
