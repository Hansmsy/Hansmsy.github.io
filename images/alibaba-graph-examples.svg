<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" role="img" aria-labelledby="title desc">
<title id="title">从已确定特征扩展到高增益检测特征</title>
<desc id="desc">深蓝圆形节点为已确定的请求频率。绿色节点和粗箭头突出高增益候选，灰色虚线连接其他候选。特征名称和增益高低仅作示意。</desc>
<defs>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2b796a"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a8b7c6"/></marker>
</defs>
<style>
text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#1c3a5b;font-size:21px;text-anchor:middle}
.small{font-size:18px;fill:#687b8f}.gain{font-size:19px;font-weight:700;fill:#2b796a;paint-order:stroke;stroke:#fff;stroke-width:9;stroke-linejoin:round}
.candidate{fill:#edf7f2;stroke:#2b796a;stroke-width:3}.quiet{fill:#f7f9fb;stroke:#b9c7d4;stroke-width:2}
.weak{fill:none;stroke:#b9c7d4;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#gray)}
.strong{fill:none;stroke:#2b796a;stroke-width:4;marker-end:url(#green)}
</style>
<rect width="1080" height="580" fill="white"/>
<path d="M770 132L903 108M779 160L927 251M776 383L928 287M773 414L903 455M941 133L961 239M960 301L940 429" fill="none" stroke="#e1e8ef" stroke-width="2"/>
<path class="weak" d="M324 235Q278 172 232 141"/>
<path class="weak" d="M312 322Q259 365 222 389"/>
<path class="weak" d="M403 351Q422 400 448 424"/>
<path class="strong" d="M444 255Q551 178 659 157"/>
<path class="strong" d="M447 312Q554 379 659 393"/>
<circle cx="375" cy="285" r="82" fill="#edf3f9"/>
<circle cx="375" cy="285" r="70" fill="#305f8e" stroke="#1c3a5b" stroke-width="3"/>
<text x="375" y="279" style="fill:#fff;font-size:23px;font-weight:700">请求频率</text>
<text x="375" y="309" style="fill:#d9e9f7;font-size:18px">已确定特征</text>
<circle class="quiet" cx="185" cy="112" r="56"/>
<text x="185" y="106">重复频率</text><text x="185" y="134">指标</text>
<circle class="quiet" cx="175" cy="420" r="56"/>
<text x="175" y="414">相近统计</text><text x="175" y="442">特征</text>
<circle class="quiet" cx="478" cy="470" r="53"/>
<text x="478" y="464">其他检测</text><text x="478" y="492">特征</text>
<text x="273" y="188" class="small" style="paint-order:stroke;stroke:white;stroke-width:8">增益较低</text>
<text x="260" y="374" class="small" style="paint-order:stroke;stroke:white;stroke-width:8">信息重复</text>
<circle cx="720" cy="145" r="72" fill="#f1f8f5"/>
<circle class="candidate" cx="720" cy="145" r="60"/>
<text x="720" y="140" style="font-weight:700;fill:#2b796a">访问间隔</text><text x="720" y="169" class="small">待检测</text>
<circle cx="720" cy="395" r="72" fill="#f1f8f5"/>
<circle class="candidate" cx="720" cy="395" r="60"/>
<text x="720" y="390" style="font-weight:700;fill:#2b796a">行为序列</text><text x="720" y="419" class="small">待检测</text>
<text x="545" y="180" class="gain">较高新增增益</text>
<text x="553" y="386" class="gain">较高新增增益</text>
<text x="729" y="273" style="font-size:20px;font-weight:700;fill:#2b796a">进入下一步候选集</text>
<text x="729" y="302" class="small">结合调用成本，由Planner选择</text>
<circle cx="934" cy="101" r="34" fill="#fafbfd" stroke="#dce5ee" stroke-width="2"/>
<circle cx="967" cy="271" r="34" fill="#fafbfd" stroke="#dce5ee" stroke-width="2"/>
<circle cx="934" cy="461" r="34" fill="#fafbfd" stroke="#dce5ee" stroke-width="2"/>
<text x="934" y="108" class="small">…</text><text x="967" y="278" class="small">…</text><text x="934" y="468" class="small">…</text>
<circle cx="232" cy="555" r="8" fill="#305f8e"/><text x="301" y="561" class="small">已确定</text>
<circle cx="410" cy="555" r="8" fill="#edf7f2" stroke="#2b796a" stroke-width="2"/><text x="506" y="561" class="small">高增益候选</text>
<circle cx="646" cy="555" r="8" fill="#f7f9fb" stroke="#b9c7d4" stroke-width="2"/><text x="740" y="561" class="small">其他候选</text>
</svg>
